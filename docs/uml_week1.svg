<text x="50" y="1120" font-size="19" font-weight="bold">Quan hệ sở hữu</text>
<text x="50" y="1150" font-size="16">Hình thoi đen: composition. Tam giác rỗng: kế thừa. Mũi tên: tham chiếu không sở hữu.</text>
<text x="50" y="1180" font-size="16">Mỗi Slot chứa 1 Product; mỗi Product chứa 1 Money theo giá trị.</text>
<text x="50" y="1218" font-size="19" font-weight="bold">Phạm vi mốc đầu</text>
<text x="50" y="1248" font-size="16">DispensingState mới có khung handle. Luồng mua chưa chuyển vào Dispensing và chưa nhận tiền.</text>
<text x="50" y="1278" font-size="16">DTO sự kiện/quyết định và hợp đồng tham chiếu: xem MachineTypes.hpp và docs/02_design.md.</text>
</g></svg>